name: "Build iOS"

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:

jobs:
  build-ios:
    # Explicit names keep the required `Build iOS App` check name unchanged.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build iOS App
            runner: macos-latest
          - name: Build iOS App (Xcode 27)
            runner: xcode-27
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Create .env file
        run: echo -e "${{ secrets.ENV_FILE }}" > example/.env
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build iOS App
        run: pushd example && flutter build ios --release --no-codesign --no-tree-shake-icons && popd
