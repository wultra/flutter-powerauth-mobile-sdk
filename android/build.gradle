group = "com.wultra.android.powerauth.flutter"
version = "0.0.1-alpha"

apply plugin: "com.android.library"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // TODO: Remove the snapshots repository once PowerAuth SDK 2.0.0 is released.
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

dependencies {
    api "com.wultra.android.powerauth:powerauth-sdk:2.0.0-SNAPSHOT"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

android {
    namespace = "com.wultra.android.powerauth.flutter"

    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }
}
